name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy matplotlib opencv-python-headless
      - name: Compile all scripts
        run: python -m py_compile tracker/*.py tools/*.py
      - name: Tracker on the sample eye video
        run: python tracker/eye_tracker.py --video data/samples/gaze_sweep.mov --headless --no-udp --max-frames 60
      - name: Analysis on the sample session log
        run: python tools/analyze_session.py data/samples/session_example.csv --out /tmp/analysis
      - name: Shell scripts
        run: bash -n tools/run_session.sh
